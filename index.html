<html lang="en">
<head>
<meta charset="utf-8" />

<title>Org — Rajashree Pimpalkhare</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1c2530;
    --card-h: #243040;
    --line: #2c3a4a;
    --text: #e8eef4;
    --muted: #8b9aab;
    --svp: #c9a227;
    --vp: #6ea8ff;
    --srd: #7dd3c7;
    --dir: #9b8afb;
    --srm: #f0a36b;
    --mgr: #86c591;
    --ic: #6b7c8d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 24px; background: rgba(15,20,25,.92);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(10px);
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .controls { display: flex; gap: 8px; margin-left: auto; }
  button {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: var(--card-h); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  main { padding: 28px 20px 80px; overflow-x: auto; }
  .tree { display: flex; flex-direction: column; align-items: center; min-width: max-content; }
  .node-wrap { display: flex; flex-direction: column; align-items: center; }
  .card {
    position: relative; min-width: 210px; max-width: 240px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px 10px; cursor: default; text-align: left;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    transition: background .15s, transform .15s, box-shadow .15s;
  }
  .card.has-kids { cursor: pointer; }
  .card.has-kids:hover { background: var(--card-h); transform: translateY(-1px);
    box-shadow: 0 12px 28px rgba(0,0,0,.35); }
  .name { font-weight: 600; font-size: 14px; letter-spacing: -.01em; padding-right: 16px; }
  .title { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .meta { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .pill {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: #243140; color: var(--text);
  }
  .pill.team { background: #1e3a2f; color: #9be7c4; }
  .pill.directs { background: #1e3048; color: #9bc4f0; }
  .pill.ics { background: #2a2438; color: #cbb8ff; }
  .leave { font-size: 10px; color: #f0c674; margin-top: 6px; letter-spacing: .04em; text-transform: uppercase; }
  .bar { position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 2px 2px 0; }
  .kids { display: flex; justify-content: center; align-items: flex-start; gap: 18px; padding-top: 28px; position: relative; }
  .kids::before {
    content: ""; position: absolute; top: 0; left: 50%; width: 0; height: 28px;
    border-left: 1px solid var(--line);
  }
  .kid { position: relative; }
  .kids > .kid:not(:only-child)::after {
    content: ""; position: absolute; top: 0; height: 0; border-top: 1px solid var(--line);
  }
  .kids > .kid:first-child:not(:only-child)::after { left: 50%; right: 0; }
  .kids > .kid:last-child:not(:only-child)::after { left: 0; right: 50%; }
  .kids > .kid:not(:first-child):not(:last-child)::after { left: 0; right: 0; }
  .kids > .kid::before {
    content: ""; position: absolute; top: 0; left: 50%; width: 0; height: 28px;
    border-left: 1px solid var(--line);
  }
  .kid > .node-wrap { padding-top: 28px; }
  .hidden { display: none !important; }
  .chev {
    position: absolute; right: 10px; top: 10px; width: 16px; height: 16px;
    color: var(--muted); font-size: 11px; line-height: 16px; text-align: center;
  }
  .ic-col {
    display: flex; flex-direction: column; gap: 6px;
    min-width: 200px; max-width: 240px;
    padding-top: 28px; position: relative;
  }
  .ic-col::before {
    content: ""; position: absolute; top: 0; left: 50%; width: 0; height: 28px;
    border-left: 1px dashed var(--line);
  }
  .ic-col .ic-label {
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); padding: 0 4px 2px;
  }
  .ic-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    background: #161d25; border: 1px solid #243040; border-radius: 8px;
    padding: 6px 10px;
  }
  .ic-row .n { font-size: 13px; font-weight: 500; }
  .ic-row .t { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .ic-row .tag { font-size: 10px; color: #f0c674; margin-left: 4px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 24px 32px; }
</style>
</head>

<style>
  #gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: #0f1419;
  }
  #gate.ok { display: none; }
  #gate .box {
    width: min(360px, 90vw);
    background: #1c2530; border: 1px solid #2c3a4a; border-radius: 14px;
    padding: 28px 24px 22px; box-shadow: 0 16px 48px rgba(0,0,0,.4);
  }
  #gate h2 { margin: 0 0 6px; font-size: 18px; }
  #gate p { margin: 0 0 16px; color: #8b9aab; font-size: 13px; }
  #gate input {
    width: 100%; background: #0f1419; color: #e8eef4;
    border: 1px solid #2c3a4a; border-radius: 8px;
    padding: 10px 12px; font-size: 14px; outline: none;
  }
  #gate input:focus { border-color: #4da3ff; }
  #gate button {
    margin-top: 12px; width: 100%;
    background: #243040; color: #e8eef4; border: 1px solid #2c3a4a;
    border-radius: 8px; padding: 10px; cursor: pointer; font-size: 14px;
  }
  #gate button:hover { background: #2c3a4a; }
  #gate .err { color: #f0a36b; font-size: 12px; margin-top: 10px; min-height: 16px; }
  body.locked header, body.locked main, body.locked footer { visibility: hidden; }
</style>
<div id="gate">
  <form class="box" id="gate-form" autocomplete="off">
    <h2>Org chart</h2>
    <p>Password required to view.</p>
    <input id="gate-pw" type="password" placeholder="Password" autofocus />
    <button type="submit">Open</button>
    <div class="err" id="gate-err"></div>
  </form>
</div>
<script>
(function () {
  const HASH = "b20a91ab5c821164d95c447370b23d901e7f9d03a3dc85923577d89aa5d4f87b";
  const KEY = "orgchart.ok";
  async function sha256(s) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  function unlock() {
    document.getElementById("gate").classList.add("ok");
    document.body.classList.remove("locked");
    sessionStorage.setItem(KEY, "1");
  }
  if (sessionStorage.getItem(KEY) === "1") {
    unlock();
    return;
  }
  document.body.classList.add("locked");
  document.getElementById("gate-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("gate-pw").value;
    const h = await sha256(pw);
    if (h === HASH) unlock();
    else document.getElementById("gate-err").textContent = "Incorrect password";
  });
})();
</script>

const COLOR = {
  'SVP': 'var(--svp)',
  'VP': 'var(--vp)',
  'Sr Director': 'var(--srd)',
  'Director': 'var(--dir)',
  'Sr Manager': 'var(--srm)',
  'Manager': 'var(--mgr)',
};

function icColumn(list) {
  const col = document.createElement('div');
  col.className = 'ic-col detail';
  const lab = document.createElement('div');
  lab.className = 'ic-label';
  lab.textContent = list.length + ' IC' + (list.length === 1 ? '' : 's');
  col.appendChild(lab);
  list.forEach(p => {
    const row = document.createElement('div');
    row.className = 'ic-row';
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = p.name;
    if (p.leave) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'leave';
      n.appendChild(tag);
    } else if (p.contractor) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'C';
      n.appendChild(tag);
    }
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = p.title || '';
    row.appendChild(n);
    row.appendChild(t);
    col.appendChild(row);
  });
  return col;
}

function card(node, depth) {
  const wrap = document.createElement('div');
  wrap.className = 'node-wrap';

  const c = document.createElement('div');
  c.className = 'card ' + node.title.replace(/\s+/g,'');
  const hasDetail = node.children.length || (node.icList && node.icList.length);
  if (hasDetail) c.classList.add('has-kids');

  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.style.background = COLOR[node.title] || 'var(--ic)';
  c.appendChild(bar);

  if (hasDetail) {
    const ch = document.createElement('div');
    ch.className = 'chev';
    ch.textContent = depth >= 1 ? '▸' : '▾';
    c.appendChild(ch);
  }

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = node.name;
  c.appendChild(name);

  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = node.title + (node.location ? ' · ' + node.location.split(' - ')[0] : '');
  c.appendChild(title);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<span class="pill team">${node.team} team</span>` +
    `<span class="pill directs">${node.directs} direct</span>` +
    (node.ics ? `<span class="pill ics">${node.ics} IC</span>` : '');
  c.appendChild(meta);

  if (node.leave) {
    const l = document.createElement('div');
    l.className = 'leave';
    l.textContent = 'On leave';
    c.appendChild(l);
  }

  wrap.appendChild(c);

  if (hasDetail) {
    const kids = document.createElement('div');
    kids.className = 'kids detail';
    if (depth >= 1) kids.classList.add('hidden');

    node.children.forEach(ch => {
      const k = document.createElement('div');
      k.className = 'kid';
      k.appendChild(card(ch, depth + 1));
      kids.appendChild(k);
    });

    if (node.icList && node.icList.length) {
      const k = document.createElement('div');
      k.className = 'kid';
      const icWrap = document.createElement('div');
      icWrap.className = 'node-wrap';
      icWrap.appendChild(icColumn(node.icList));
      k.appendChild(icWrap);
      kids.appendChild(k);
    }

    wrap.appendChild(kids);

    if (depth >= 1) c.classList.add('collapsed');
    c.addEventListener('click', () => {
      const hidden = kids.classList.toggle('hidden');
      c.classList.toggle('collapsed', hidden);
      c.querySelector('.chev').textContent = hidden ? '▸' : '▾';
    });
  }
  return wrap;
}

document.getElementById('tree').appendChild(card(DATA, 0));

function setAll(hide) {
  document.querySelectorAll('.detail').forEach(k => {
    if (k.classList.contains('kids')) k.classList.toggle('hidden', hide);
  });
  document.querySelectorAll('.card.has-kids').forEach(c => {
    c.classList.toggle('collapsed', hide);
    const ch = c.querySelector('.chev');
    if (ch) ch.textContent = hide ? '▸' : '▾';
  });
}
document.getElementById('expand').onclick = () => setAll(false);
document.getElementById('collapse').onclick = () => setAll(true);
</script>
